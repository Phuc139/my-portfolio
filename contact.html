<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ - Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Trang chủ</a>
    <a href="about.html">Giới thiệu</a>
    <a href="projects.html">Dự án</a>
    <a href="contact.html">Liên hệ</a>
    <button id="theme-toggle">🌙 Dark</button>
  </nav>

  <section class="reveal">
    <h2>Liên hệ với mình</h2>
    <div class="card">
      
      <form class="contact-form" action="https://formspree.io/f/xeagpdvg" method="POST">
        <label>Họ và tên:</label>
        <input type="text" name="name" required placeholder="Nhập tên của bạn">

        <label>Email:</label>
        <input type="email" name="email" required placeholder="email@example.com">

        <label>Lời nhắn:</label>
        <textarea name="message" rows="5" required placeholder="Nội dung liên hệ..."></textarea>

        <button type="submit">Gửi tin nhắn</button>
      </form>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
